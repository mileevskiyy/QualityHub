name: Quality checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qualityhub
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: qualityhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualityhub -d qualityhub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_POSTGRES_URL: postgresql://qualityhub:ci-only-password@127.0.0.1:5432/qualityhub_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test --config playwright.demo.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
